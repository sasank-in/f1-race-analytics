[project]
name = "f1x"
version = "0.1.0"
description = "F1 Race Analysis Engine"
requires-python = ">=3.12"

dependencies = [
    # ingestion
    "fastf1>=3.8.3",
    "httpx>=0.27",
    # transform
    "polars>=1.17",
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=18.0",
    # persistence
    "sqlalchemy>=2.0.36",
    "psycopg[binary,pool]>=3.2",
    "alembic>=1.14",
    # api
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "redis>=5.2",
    # analysis
    "scipy>=1.14",
    "scikit-learn>=1.6",
    "statsmodels>=0.14",
    # cli / logging
    "typer>=0.15",
    "rich>=13.9",
    "structlog>=24.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-asyncio>=0.25",
    "testcontainers[postgres]>=4.9",
    "ruff>=0.8",
    "mypy>=1.14",
]
ml = [
    "lightgbm>=4.5",
    "optuna>=4.1",
]

[project.scripts]
f1x = "f1x.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/f1x"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "../tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF", "S", "BLE", "ANN", "ARG"]
# Diagnostic CLI code and fixtures deliberately catch broad exceptions to report them.
per-file-ignores = { "../tests/**" = ["S101", "ANN001", "ANN201"] }

[tool.mypy]
python_version = "3.12"
strict = true

# Neither library ships type stubs or a py.typed marker.
[[tool.mypy.overrides]]
module = ["fastf1", "fastf1.*", "statsmodels.*", "sklearn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["../tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
    "integration: requires a live database (deselect with -m 'not integration')",
]
asyncio_mode = "auto"
